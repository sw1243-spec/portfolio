<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#323234"/>
      <stop offset="1" stop-color="#1c1c1e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="4" fill="#ffdb70" opacity="0.9"/>
  <text x="64" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="17" letter-spacing="4" fill="#ffdb70">TRAINING RECORDS</text>
  <text x="62" y="215" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="600" fill="#fafafa">Training</text>
  <text x="62" y="285" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="600" fill="#fafafa">Interface</text>
  <text x="64" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#9a9a9c">Line touchscreens · revision-linked sign-off · audit pack</text>

  <g transform="translate(500,115)" opacity="0.92">
    <!-- touchscreen with step buttons -->
    <rect x="0" y="0" width="220" height="150" rx="12" stroke="#5a5a5c" stroke-width="3" fill="none"/>
    <g font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">
      <rect x="16" y="18" width="40" height="28" rx="6" fill="#ffdb70"/><text x="36" y="37" fill="#1c1c1e">1</text>
      <rect x="64" y="18" width="40" height="28" rx="6" stroke="#5a5a5c" stroke-width="2" fill="none"/><text x="84" y="37" fill="#9a9a9c">2</text>
      <rect x="112" y="18" width="40" height="28" rx="6" stroke="#5a5a5c" stroke-width="2" fill="none"/><text x="132" y="37" fill="#9a9a9c">3</text>
      <rect x="160" y="18" width="40" height="28" rx="6" stroke="#5a5a5c" stroke-width="2" fill="none"/><text x="180" y="37" fill="#9a9a9c">4</text>
    </g>
    <line x1="16" y1="66" x2="204" y2="66" stroke="#5a5a5c" stroke-width="2"/>
    <!-- signature -->
    <path d="M 22 118 c 14 -26 22 -26 24 -6 c 2 16 10 14 18 -6 c 8 -18 14 -10 16 4 c 2 10 10 8 18 -4" stroke="#fafafa" stroke-width="3" fill="none" stroke-linecap="round"/>
    <line x1="16" y1="130" x2="130" y2="130" stroke="#5a5a5c" stroke-width="2"/>
    <!-- verified -->
    <circle cx="178" cy="108" r="22" stroke="#4a9d5f" stroke-width="3" fill="none"/>
    <path d="M 167 108 l 8 8 l 15 -16" stroke="#4a9d5f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- revision tag -->
    <rect x="132" y="168" width="88" height="28" rx="14" stroke="#ffdb70" stroke-width="2" fill="none"/>
    <text x="176" y="188" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#ffdb70" text-anchor="middle">Rev F</text>
  </g>
</svg>
